# FantApperò CI quality gates (EP01-03)
# Required jobs: lint, format, typecheck, unit tests, build
# Informative: EP00 offline suites
# Required: migrations (EP01-06 — Postgres service + Alembic)
# No production secrets. Local equivalents: docs/development/quality_gates.md

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Required — Python
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: python -m pip install -e "./backend[dev]"

      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check src tests

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check src tests

  python-test:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: python -m pip install -e "./backend[dev]"

      - name: Pytest
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest \
            --junitxml=artifacts/pytest-junit.xml \
            -ra \
            --tb=short \
            2>&1 | tee artifacts/pytest.log

      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-diagnostics-${{ github.run_id }}
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Required — JavaScript / TypeScript
  # ---------------------------------------------------------------------------
  js-lint:
    name: JS lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc)
        run: pnpm lint

  js-typecheck:
    name: JS typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  js-test:
    name: JS unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          pnpm test 2>&1 | tee artifacts/js-test.log

      - name: Upload JS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: js-test-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  js-build:
    name: JS build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages + web + mobile
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            pnpm run build:packages
            pnpm run build:web
            pnpm --filter @fantappero/mobile build
          } 2>&1 | tee artifacts/js-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: js-build-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Required — SAST (EP12-04 security review)
  #
  # bandit is pure static analysis of the current tree: deterministic, fast
  # (~seconds), no external network calls whose result can drift between runs
  # of the same commit. That determinism is why this is a blocking gate job
  # (unlike e2e-critical-flow above, which is informative because of real
  # browser/Docker Compose flakiness). `-ll` fails the build only on
  # medium/high severity — today's 48 low-severity `assert`/`try-except-pass`
  # findings are accepted code-style patterns (see
  # docs/operations/beta_readiness/ep12-04_security_review.md), not
  # vulnerabilities; a real medium/high finding still fails CI.
  # ---------------------------------------------------------------------------
  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install bandit
        run: python -m pip install "bandit==1.9.4"

      - name: Bandit scan (backend/src, medium+ severity fails the build)
        working-directory: backend
        run: python -m bandit -r src -ll

  # ---------------------------------------------------------------------------
  # Required — secret scanning (EP12-04 security review)
  #
  # Deterministic pattern-match over tracked history, same reasoning as
  # python-sast above: fast, no external drift, safe to block merges.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Informative — dependency audit (EP12-04 security review)
  #
  # pip-audit / pnpm audit query external vulnerability databases (PyPA
  # advisory DB, npm/GHSA advisories) that change independently of this
  # repo's code — a newly disclosed CVE in an already-pinned, untouched
  # dependency can flip this job from green to red between two runs of the
  # *same* commit. Blocking ci-success on that would stop unrelated merges
  # for a problem the PR didn't introduce and can't fix by itself. Kept
  # informative (continue-on-error) and running on every push so findings are
  # visible immediately; revisit once there's a documented waiver/triage
  # process for accepting a dependency risk without unpinning it same-day.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (pip-audit + pnpm audit, informative)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev) + pip-audit
        run: |
          python -m pip install -e "./backend[dev]"
          python -m pip install pip-audit

      - name: pip-audit (backend dependencies)
        run: python -m pip_audit

      - name: Set up pnpm
        if: always()
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        if: always()
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (JS/TS dependencies)
        if: always()
        run: pnpm audit

  # ---------------------------------------------------------------------------
  # Aggregate required status (use this as the single branch-protection check)
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI success
    if: always()
    needs:
      - python-lint
      - python-test
      - js-lint
      - js-typecheck
      - js-test
      - js-build
      - migrations
      - python-sast
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          declare -A results=(
            [python-lint]="${{ needs.python-lint.result }}"
            [python-test]="${{ needs.python-test.result }}"
            [js-lint]="${{ needs.js-lint.result }}"
            [js-typecheck]="${{ needs.js-typecheck.result }}"
            [js-test]="${{ needs.js-test.result }}"
            [js-build]="${{ needs.js-build.result }}"
            [migrations]="${{ needs.migrations.result }}"
            [python-sast]="${{ needs.python-sast.result }}"
            [secret-scan]="${{ needs.secret-scan.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job → $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi
          echo "All required quality gates passed."

  # ---------------------------------------------------------------------------
  # Required — database migrations (EP01-06)
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fantappero
          POSTGRES_PASSWORD: fantappero_ci_only
          POSTGRES_DB: fantappero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantappero -d fantappero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fantappero:fantappero_ci_only@127.0.0.1:5432/fantappero
      FANTAPPERO_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: python -m pip install -e "./backend[dev]"

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check migration coherence and drift
        run: python infra/scripts/check_migrations.py

      - name: Database integration tests
        working-directory: backend
        run: python -m pytest tests/integration/database -ra --tb=short

  # ---------------------------------------------------------------------------
  # Informative — EP12-01 critical-flow E2E suite (Playwright + Docker Compose)
  #
  # Deliberately NOT in ci-success's `needs`: a full Docker Compose stack
  # (build + 5 services + browser automation) is far slower than the rest of
  # the required gates, and the risk section of
  # docs/operations/beta_readiness/ep12-01_suite_e2e.md flags this explicitly.
  # Gated to manual runs and to PRs/pushes on the `claude/M5` pre-release
  # branch, so it never slows down ordinary main/dev pushes or PRs.
  # ---------------------------------------------------------------------------
  e2e-critical-flow:
    name: E2E critical flow (EP12-01, informative)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/claude/M5' ||
      github.head_ref == 'claude/M5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and start stack
        run: docker compose up -d --build postgres redis api web mailpit

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          for service in postgres redis api web mailpit; do
            echo "waiting for fantappero-$service..."
            timeout 180 bash -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' fantappero-$service 2>/dev/null)\" = healthy ]; do sleep 3; done"
          done

      - name: Install Playwright
        working-directory: apps/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: apps/e2e
        run: npm run test:e2e

      - name: Docker compose logs (on failure)
        if: failure()
        run: docker compose logs --tail=200 api web mailpit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Informative — EP12-03 isolated capacity smoke (k6 + Compose)
  #
  # The full steady/spike run is an operator gate because its numbers depend on
  # runner capacity. CI only proves that the disposable stack, seed, Celery
  # probes and k6 smoke remain executable; it is intentionally not in
  # ci-success's `needs`.
  # ---------------------------------------------------------------------------
  performance-smoke:
    name: Performance smoke (EP12-03, informative)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/claude/M5' ||
      github.head_ref == 'claude/M5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      PERF_USER_COUNT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run isolated capacity smoke
        run: make performance-smoke

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-${{ github.run_id }}
          path: artifacts/performance/results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated performance services
        if: always()
        run: >-
          docker compose --profile performance rm -sf
          api-perf worker-perf postgres-perf redis-perf

  # ---------------------------------------------------------------------------
  # Informative — do not block merge (continue-on-error)
  # ---------------------------------------------------------------------------
  ep00-extra-tests:
    name: EP00 offline suites (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install pytest
        # Editable installs of tools/experiments need package discovery tweaks;
        # suites are offline and only need pytest + local pythonpath from pyproject.
        run: python -m pip install "pytest==8.4.1"

      - name: Run EP00 pytest suites
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            echo "=== api_quota_estimator ==="
            (cd tools/api_quota_estimator && python -m pytest --junitxml=../../artifacts/quota-junit.xml -ra --tb=short)
            echo "=== rating_beta ==="
            (cd experiments/rating_beta && python -m pytest --junitxml=../../artifacts/rating-junit.xml -ra --tb=short)
          } 2>&1 | tee artifacts/ep00-tests.log

      - name: Upload EP00 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ep00-test-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
