# FantApperò CI quality gates (EP01-03)
# Required jobs: lint, format, typecheck, unit tests, build
# Informative: EP00 offline suites
# Required: migrations (EP01-06 — Postgres service + Alembic)
# No production secrets. Local equivalents: docs/development/quality_gates.md

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Required — Python
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: python -m pip install -e "./backend[dev]"

      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check src tests

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check src tests

  python-test:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: python -m pip install -e "./backend[dev]"

      - name: Pytest
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest \
            --junitxml=artifacts/pytest-junit.xml \
            -ra \
            --tb=short \
            2>&1 | tee artifacts/pytest.log

      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-diagnostics-${{ github.run_id }}
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Required — JavaScript / TypeScript
  # ---------------------------------------------------------------------------
  js-lint:
    name: JS lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc)
        run: pnpm lint

  js-typecheck:
    name: JS typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  js-test:
    name: JS unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          pnpm test 2>&1 | tee artifacts/js-test.log

      - name: Upload JS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: js-test-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  js-build:
    name: JS build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages + web + mobile
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            pnpm run build:packages
            pnpm run build:web
            pnpm --filter @fantappero/mobile build
          } 2>&1 | tee artifacts/js-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: js-build-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Aggregate required status (use this as the single branch-protection check)
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI success
    if: always()
    needs:
      - python-lint
      - python-test
      - js-lint
      - js-typecheck
      - js-test
      - js-build
      - migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          declare -A results=(
            [python-lint]="${{ needs.python-lint.result }}"
            [python-test]="${{ needs.python-test.result }}"
            [js-lint]="${{ needs.js-lint.result }}"
            [js-typecheck]="${{ needs.js-typecheck.result }}"
            [js-test]="${{ needs.js-test.result }}"
            [js-build]="${{ needs.js-build.result }}"
            [migrations]="${{ needs.migrations.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job → $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi
          echo "All required quality gates passed."

  # ---------------------------------------------------------------------------
  # Required — database migrations (EP01-06)
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fantappero
          POSTGRES_PASSWORD: fantappero_ci_only
          POSTGRES_DB: fantappero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantappero -d fantappero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fantappero:fantappero_ci_only@127.0.0.1:5432/fantappero
      FANTAPPERO_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: python -m pip install -e "./backend[dev]"

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check migration coherence and drift
        run: python infra/scripts/check_migrations.py

      - name: Database integration tests
        working-directory: backend
        run: python -m pytest tests/integration/database -ra --tb=short

  # ---------------------------------------------------------------------------
  # Informative — do not block merge (continue-on-error)
  # ---------------------------------------------------------------------------
  ep00-extra-tests:
    name: EP00 offline suites (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install pytest
        # Editable installs of tools/experiments need package discovery tweaks;
        # suites are offline and only need pytest + local pythonpath from pyproject.
        run: python -m pip install "pytest==8.4.1"

      - name: Run EP00 pytest suites
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            echo "=== api_quota_estimator ==="
            (cd tools/api_quota_estimator && python -m pytest --junitxml=../../artifacts/quota-junit.xml -ra --tb=short)
            echo "=== rating_beta ==="
            (cd experiments/rating_beta && python -m pytest --junitxml=../../artifacts/rating-junit.xml -ra --tb=short)
          } 2>&1 | tee artifacts/ep00-tests.log

      - name: Upload EP00 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ep00-test-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
