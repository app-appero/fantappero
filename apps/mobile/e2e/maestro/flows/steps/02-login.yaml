appId: com.fantappero.mobile
---
# Passo 3: login con l'utente appena registrato e verificato.
# Env attese: TEST_EMAIL, TEST_PASSWORD.

- assertVisible:
    id: "screen-auth"
- tapOn:
    id: "auth-email"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "auth-password"
- inputText: ${TEST_PASSWORD}
# CORRETTO nel dry run (26/09/2026): stesso problema del form di
# registrazione — la tastiera copre "Accedi" finché non si chiude.
- hideKeyboard
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    notVisible:
      id: "screen-auth"
    timeout: 15000
