appId: com.fantappero.mobile
---
# Passo 3: login con l'utente appena registrato e verificato.
# Env attese: TEST_EMAIL, TEST_PASSWORD.

- assertVisible:
    id: "screen-auth"
# Scheda email chiusa dietro «Continua con email» quando Google è configurato
# (in locale non lo è e la scheda è già aperta, su Accedi).
- runFlow:
    when:
      visible:
        id: "auth-email-toggle"
    commands:
      - tapOn:
          id: "auth-email-toggle"
- runFlow:
    when:
      visible:
        id: "auth-tab-login"
    commands:
      - tapOn:
          id: "auth-tab-login"
- tapOn:
    id: "auth-email"
# Dopo la registrazione l'email è già scritta: svuotare il campo prima di riscriverla.
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "auth-password"
- inputText: ${TEST_PASSWORD}
# CORRETTO nel dry run (26/09/2026): stesso problema del form di
# registrazione — la tastiera copre "Accedi" finché non si chiude.
- hideKeyboard
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    notVisible:
      id: "screen-auth"
    timeout: 15000
