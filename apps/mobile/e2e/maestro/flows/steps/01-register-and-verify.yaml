appId: com.fantappero.mobile
---
# Passi 1-2: registrazione nuovo utente + verifica email.
# Env attese (passate dal flow orchestratore): TEST_EMAIL, TEST_DISPLAY_NAME,
# TEST_PASSWORD, MAILPIT_BASE_URL.

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "screen-auth"
    timeout: 20000
# Dal 19/11 la registrazione è la scheda «Registrati» della schermata di accesso
# (non più la schermata a parte). Con Google configurato la scheda è chiusa
# dietro «Continua con email»; in locale Google manca ed è già aperta.
- scrollUntilVisible:
    element:
      id: "auth-email-toggle|auth-tab-register"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "auth-email-toggle"
    commands:
      - tapOn:
          id: "auth-email-toggle"
- tapOn:
    id: "auth-tab-register"
- assertVisible:
    id: "auth-email-register"

- tapOn:
    id: "auth-register-display-name"
- inputText: ${TEST_DISPLAY_NAME}
- tapOn:
    id: "auth-register-email"
- inputText: ${TEST_EMAIL}
# CORRETTO nel dry run (26/09/2026): la tastiera copre i campi sottostanti,
# Maestro non li trova più finché non si chiude.
- hideKeyboard
- tapOn:
    id: "auth-register-password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-register-submit"
# In locale la conferma email è accesa: dopo la registrazione l'accesso
# automatico risponde «verifica l'email» e la scheda mostra il messaggio.
- extendedWaitUntil:
    visible:
      id: "auth-register-success"
    timeout: 15000

- tapOn:
    id: "auth-register-verify-link"
- assertVisible:
    id: "screen-auth-verify-email"

# NOTA: sintassi runScript/http/output non ancora verificata contro la
# versione installata di Maestro CLI — vedi README.md.
- runScript:
    file: ../../scripts/fetchVerificationToken.js
    env:
      MAESTRO_TEST_EMAIL: ${TEST_EMAIL}
      MAESTRO_MAILPIT_BASE_URL: ${MAILPIT_BASE_URL}

- tapOn:
    id: "auth-verify-email-token"
- inputText: ${output.verificationToken}
- tapOn:
    id: "auth-verify-email-submit"
- assertVisible:
    id: "auth-verify-email-success"
- tapOn:
    id: "auth-verify-email-back-login"
- assertVisible:
    id: "screen-auth"
