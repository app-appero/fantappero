# 01-login-email.yaml
# Accesso con email e password su dev (API Railway).
# Esecuzione: maestro test -e QA_EMAIL=qa-02@test.fantappero.it -e QA_PASSWORD=... 01-login-email.yaml
#
# PROBLEMA NOTO (18/11, Maestro 2.10.0 su emulatore API 33): sia inputText sia
# setClipboard + pasteText si bloccano dopo 12-13 caratteri e finiscono con
# DeviceServerDiedException. Lo stesso testo con `adb shell input text` entra
# subito: il problema è di Maestro, non dell'app. Finché non si risolve,
# l'accesso si fa con adb prima di lanciare i flussi 02-04.
appId: com.fantappero.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "screen-auth"
    timeout: 20000
# Il modulo è in fondo alla pagina: portare il pulsante Accedi al centro, così
# email e password restano sopra la tastiera quando si apre.
- scrollUntilVisible:
    element:
      id: "auth-login-submit"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "auth-email"
- setClipboard: ${QA_EMAIL}
- pasteText
- tapOn:
    id: "auth-password"
- setClipboard: ${QA_PASSWORD}
- pasteText
- hideKeyboard
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    visible:
      id: "app-menu-button"
    timeout: 30000
- assertNotVisible:
    id: "auth-error"
- takeScreenshot: dev-01-home
