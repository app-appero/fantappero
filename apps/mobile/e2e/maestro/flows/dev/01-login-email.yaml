# 01-login-email.yaml
# Accesso con email e password su dev (API Railway).
# Esecuzione: maestro test -e QA_EMAIL=qa-02@test.fantappero.it -e QA_PASSWORD=... 01-login-email.yaml
#
# Richiede Maestro >= 2.12.0: con la 2.10.0 inputText (e pasteText) si
# bloccava dopo 12-13 caratteri con DeviceServerDiedException. Verificato
# funzionante con la 2.12.1 il 18/11 sull'emulatore Pixel 6 / API 33.
appId: com.fantappero.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "screen-auth"
    timeout: 20000
# Dal 19/11 con Google configurato l'email è chiusa dietro «Continua con email»;
# senza Google (dev) la scheda è già aperta. Si aspetta che compaia l'una o
# l'altra (arrivano dopo GET /auth/options; gli id di Maestro sono regex).
- scrollUntilVisible:
    element:
      id: "auth-email-toggle|auth-login-submit"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "auth-email-toggle"
    commands:
      - tapOn:
          id: "auth-email-toggle"
# Il modulo è in fondo alla pagina: portare il pulsante Accedi al centro.
- scrollUntilVisible:
    element:
      id: "auth-login-submit"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "auth-email"
- inputText: ${QA_EMAIL}
# Con la tastiera aperta il campo password resta sotto: chiuderla prima.
- hideKeyboard
- tapOn:
    id: "auth-password"
- inputText: ${QA_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    visible:
      id: "app-menu-button"
    timeout: 30000
- assertNotVisible:
    id: "auth-error"
- takeScreenshot: dev-01-home
