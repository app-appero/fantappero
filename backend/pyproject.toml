[project]
name = "fantappero-backend"
version = "0.0.0"
description = "FantApperò backend (SPD + domain + FastAPI scaffold)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "psycopg[binary]==3.2.13",
    "redis==6.2.0",
    "celery==5.5.3",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "alembic==1.16.4",
    "argon2-cffi==25.1.0",
    "PyJWT==2.13.0",
    "email-validator==2.2.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.4",
    "hypothesis==6.140.3",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
